name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Run Windows workspace tests
        if: runner.os == 'Windows'
        env:
          CARGO_TERM_COLOR: never
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $testLog = New-TemporaryFile
          try {
            cargo +stable test --locked --workspace -j 2 --no-fail-fast -- --test-threads=2 2>&1 |
              Tee-Object -FilePath $testLog.FullName
            $result = $LASTEXITCODE
            if ($result -ne 0) {
              Select-String -LiteralPath $testLog.FullName -Pattern "^test [a-z0-9_:]+ \.\.\. FAILED$|^thread '[a-z0-9_:]+' (\([0-9]+\) )?panicked at [a-z0-9_./\\-]+:[0-9]+:[0-9]+:$|^error\[E[0-9]+\]:" |
                ForEach-Object { Write-Output ("::error title=Workspace test failure::{0}" -f $_.Matches[0].Value) }
            }
          } finally {
            Remove-Item -LiteralPath $testLog.FullName
          }
          exit $result
      - name: Run Linux workspace tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          test_log=$(mktemp)
          trap 'rm -- "$test_log"' EXIT
          if cargo +stable test --locked --workspace --no-fail-fast 2>&1 | tee "$test_log"; then
            exit 0
          else
            result=$?
          fi
          # Surface public test names and source locations in the check summary.
          while IFS= read -r line; do
            printf '::error title=Workspace test failure::%s\n' "$line"
          done < <(grep -E "^test [[:alnum:]_:]+ \.\.\. FAILED$|^thread '[[:alnum:]_:]+' (\([0-9]+\) )?panicked at [[:alnum:]_./-]+:[0-9]+:[0-9]+:$" "$test_log")
          exit "$result"

  binary-smoke:
    # Release tags exercise the Linux archive in Release's package job.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Verify Windows release binary
        if: runner.os == 'Windows'
        run: |
          cargo +stable build --locked --release -p context-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-binary.py target/release/context-engine.exe
      - name: Package and verify Linux release archive
        if: runner.os == 'Linux'
        run: |
          cargo +stable build --locked --release --target x86_64-unknown-linux-gnu -p context-cli
          bash scripts/package-linux.sh target/x86_64-unknown-linux-gnu/release/context-engine dist
          printf '::notice title=Verified Linux archive SHA-256::%s\n' "$(cat dist/SHA256SUMS)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: linux-x86_64-candidate
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
