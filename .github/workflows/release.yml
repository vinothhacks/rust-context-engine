name: Release
on:
  push:
    tags: ["v*"]

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged revision is on master
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/master
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: cargo +stable build --locked --release --target x86_64-unknown-linux-gnu -p context-cli
      - name: Verify tag and test extracted release binary
        run: bash scripts/package-linux.sh target/x86_64-unknown-linux-gnu/release/context-engine dist "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-release
          path: dist
      - name: Verify release files
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish the existing tag
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "context-engine-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
