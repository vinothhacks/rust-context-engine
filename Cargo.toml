[workspace]
resolver = "2"
members = [
    "crates/context-core",
    "crates/context-execution",
    "crates/context-capture",
    "crates/context-store",
    "crates/context-reducers",
    "crates/context-search",
    "crates/context-journal",
    "crates/context-mcp",
    "crates/context-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 OR MIT"
authors = ["Rust Context Engine Contributors"]
repository = "https://github.com/vinothhacks/rust-context-engine"

[workspace.dependencies]
# Internal workspace crates
context-core = { path = "crates/context-core" }
context-execution = { path = "crates/context-execution" }
context-capture = { path = "crates/context-capture" }
context-store = { path = "crates/context-store" }
context-reducers = { path = "crates/context-reducers" }
context-search = { path = "crates/context-search" }
context-journal = { path = "crates/context-journal" }
context-mcp = { path = "crates/context-mcp" }

# Pinned external dependencies (permissive licenses only: MIT / Apache-2.0 / BSD / CC0)
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "0.5"
dunce = "1.0"
hex = "0.4"
ignore = "0.4"
proptest = "1.5"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2.0"
tokio = { version = "1.41", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "macros",
    "fs",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
